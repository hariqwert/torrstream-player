<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct HLS Pure Stream Test (Zero Proxy)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { width: 100%; max-width: 900px; background: #13141c; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; color: #fff; }
        .badge { background: #10b981; color: #000; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 9999px; text-transform: uppercase; }
        p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background: #1e202e; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 13px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; color: #fff; border: none; border-radius: 12px; padding: 12px 24px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; object-fit: contain; }
        .log-box { margin-top: 16px; background: #0a0a0f; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; font-family: monospace; font-size: 12px; color: #10b981; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Direct HLS Pure Stream Tester <span class="badge">Zero Proxy</span></h1>
        <p class="desc">Plays raw Akamai HLS streams directly in your browser using native Hls.js without any proxy or server intermediation (just like hlsjs.video-dev.org/demo).</p>

        <div class="input-group">
            <input type="text" id="streamInput" placeholder="Enter raw HLS (.m3u8) URL..." value="https://sonymtmnew.akamaized.net/hls/live/2120299/Footlive0510/ENG/std_lrh-800300010.m3u8?hdnea=exp=1791265771~acl=%2F*~id=76851970070204598228702150626970~hmac=c87627041f94ed8b8bf576f060df6d524a857b6a64c194e8782afdb19145c723">
            <button onclick="loadDirectStream()">Play Stream</button>
        </div>

        <div class="video-box">
            <video id="player" controls autoplay playsinline></video>
        </div>

        <div class="log-box" id="logBox">Status: Ready. Click "Play Stream" to start playback.</div>
    </div>

    <script>
        let hls = null;
        const video = document.getElementById('player');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            console.log(msg);
            const t = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${t}] ${msg}<br>` + logBox.innerHTML;
        }

        function loadDirectStream() {
            const url = document.getElementById('streamInput').value.trim();
            if (!url) return alert('Please enter a stream URL');

            log(`Initializing Hls.js for: ${url.slice(0, 70)}...`);

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    log(`✅ Manifest parsed successfully! Found ${data.levels.length} quality levels.`);
                    video.play().catch(e => log(`⚠️ Autoplay blocked (${e.message}). Click video to play.`));
                });

                hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
                    log(`⚡ Fragment loaded: seq ${data.frag.sn} (${data.frag.duration.toFixed(1)}s, ${(data.frag.loaded / 1024).toFixed(0)} KB)`);
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    log(`⚠️ HLS event: ${data.details} (Fatal: ${data.fatal})`);
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            log("Recovering network error...");
                            hls.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            log("Recovering media error...");
                            hls.recoverMediaError();
                        } else {
                            hls.destroy();
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    log("✅ Native Safari HLS loaded!");
                    video.play();
                });
            } else {
                log("❌ HLS is not supported in this browser.");
            }
        }

        // Auto-load on load if query param ?url= is passed
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const qUrl = params.get('url');
            if (qUrl) {
                document.getElementById('streamInput').value = qUrl;
            }
            loadDirectStream();
        });
    </script>
</body>
</html>
