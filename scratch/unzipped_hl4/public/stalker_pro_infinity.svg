<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%" class="stalker-pro-logo-svg">
  <defs>
    <!-- White Neon Glow Filter for Infinity Symbol -->
    <filter id="infinityGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Chrome Silver Gradient for STALKER PRO Text -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F1F5F9" />
      <stop offset="45%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="textDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Infinity Glow Background Path -->
    <path d="M 50 50 C 20 20, 5 35, 5 50 C 5 65, 20 80, 50 50 C 80 20, 95 35, 95 50 C 95 65, 80 80, 50 50 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#infinityGlow)" 
          opacity="0.95" />

    <!-- Sharp Bright Infinity Core -->
    <path d="M 50 50 C 20 20, 5 35, 5 50 C 5 65, 20 80, 50 50 C 80 20, 95 35, 95 50 C 95 65, 80 80, 50 50 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- STALKER PRO Metallic Text -->
    <text x="125" y="65" 
          fill="url(#chromeMetal)" 
          font-family="'Montserrat', 'Arial Black', 'Inter', system-ui, sans-serif" 
          font-weight="900" 
          font-size="44" 
          letter-spacing="3.5" 
          filter="url(#textDropShadow)">STALKER PRO</text>
  </g>
</svg>
