<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode | Stalker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent !important; }
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: white; margin: 0; overflow: hidden; }
        .glass-panel {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .grain {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-zinc-950">
    <!-- Ambient Background -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-zinc-950 to-zinc-950"></div>
    <div class="grain"></div>
    
    <!-- Central Content -->
    <div class="w-full max-w-xl px-8 relative z-20 flex flex-col items-center">
        <!-- Status Badge -->
        <div class="flex items-center gap-3 px-5 py-2 rounded-full border border-indigo-500/20 bg-indigo-500/10 backdrop-blur-md mb-10">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
            </span>
            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.2em]">System Upgrade</span>
        </div>
        
        <!-- Typography Header -->
        <h1 class="text-4xl md:text-5xl font-light font-['Playfair_Display'] text-center mb-6 text-slate-100 leading-tight">
            Elevating the <br/><span class="italic text-indigo-100 font-medium">streaming experience.</span>
        </h1>
        
        <p class="text-slate-400 text-center max-w-sm text-sm leading-relaxed mb-12">
            Stalker Pro is currently undergoing scheduled maintenance to improve network performance and reliability. We will be back online shortly.
        </p>

        <!-- Status Details -->
        <div class="glass-panel w-full rounded-3xl p-6 flex flex-col gap-4">
            <div class="flex items-center justify-between pb-4 border-b border-white/5">
                <div class="flex items-center gap-3 text-slate-300">
                    <i data-lucide="server" class="w-4 h-4 text-slate-500"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider">Core Servers</span>
                </div>
                <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">Updating</span>
            </div>
            <div class="flex items-center justify-between pb-4 border-b border-white/5">
                <div class="flex items-center gap-3 text-slate-300">
                    <i data-lucide="database" class="w-4 h-4 text-slate-500"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider">Database Nodes</span>
                </div>
                <span class="text-xs font-bold text-emerald-500 uppercase tracking-widest">Optimized</span>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 text-slate-300">
                    <i data-lucide="globe" class="w-4 h-4 text-slate-500"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider">CDN Routing</span>
                </div>
                <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">Rebuilding</span>
            </div>
        </div>
    </div>

    <!-- Admin Footer Link -->
    <div class="absolute bottom-8 w-full text-center z-20">
        <a href="/login.php" class="text-[10px] font-bold text-zinc-600 hover:text-zinc-400 uppercase tracking-widest transition-colors flex items-center justify-center gap-1.5">
            <i data-lucide="lock" class="w-3 h-3"></i> Administrator Console
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
<script src="/watchdog.js" id="maintenance-watchdog"></script>
</body>
</html>
